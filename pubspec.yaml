name: janken
description: "JANKEN RPS Battle Arena"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  shared_preferences: ^2.3.2

  # ✅ Socket.io real-time
  socket_io_client: ^2.0.3+1

  # ✅ Notification & Local
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Internationalization
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
